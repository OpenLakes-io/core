# OpenMetadata Values - Working Configuration
# Using PostgreSQL and OpenSearch

replicaCount: 1

openmetadata:
  config:
    logLevel: INFO
    
    openmetadata:
      host: "0.0.0.0"
      port: 8585
      adminPort: 8586
    
    # OpenSearch configuration
    elasticsearch:
      enabled: true
      host: opensearch.openlakes.svc.cluster.local
      searchType: opensearch
      port: 9200
      scheme: http
      trustStore:
        enabled: false
    
    # PostgreSQL configuration
    database:
      enabled: true
      host: openlakes-postgres.openlakes.svc.cluster.local
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata_db
      auth:
        username: openmetadata_user
        password:
          secretRef: ""
          secretKey: ""
      dbParams: ""
    
    # Disable pipeline service initially
    pipelineServiceClientConfig:
      enabled: false
    
    authentication:
      provider: basic
      publicKeys:
        - "http://openmetadata:8585/api/v1/system/config/jwks"
      enableSelfSignup: true
      jwtPrincipalClaims:
        - "email"
        - "preferred_username"
        - "sub"
    
    authorizer:
      className: "org.openmetadata.service.security.DefaultAuthorizer"
      containerRequestFilter: "org.openmetadata.service.security.JwtFilter"
      initialAdmins:
        - "admin"
      principalDomain: "open-metadata.org"
    
    secretsManager:
      provider: db

image:
  repository: docker.getcollate.io/openmetadata/server
  pullPolicy: IfNotPresent
  tag: 1.10.6

service:
  type: NodePort
  port: 8585

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Critical: Set the database password via environment variable
extraEnvs:
  - name: DB_USER_PASSWORD
    value: "openmetadata_pass"
  - name: DB_USER
    value: "openmetadata_user"
  - name: DB_HOST
    value: "openlakes-postgres.openlakes.svc.cluster.local"
  - name: DB_PORT
    value: "5432"
  - name: OM_DATABASE
    value: "openmetadata_db"
  - name: DB_SCHEME
    value: "postgresql"
  - name: DB_DRIVER
    value: "org.postgresql.Driver"

livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  periodSeconds: 60
  failureThreshold: 5
  successThreshold: 1
