{{- if .Values.openmetadata.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openmetadata-connector-configs
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openmetadata
    component: connectors
data:
  README.md: |
    # OpenMetadata Connector Configurations for OpenLakes

    This ConfigMap contains ready-to-use connector configurations for all
    OpenLakes components that OpenMetadata supports.

    ## Supported Connectors

    The following OpenLakes components can be integrated with OpenMetadata:

    ### Database Services (PROD)
    - PostgreSQL - Core database for metadata and application state
    - Trino - Distributed SQL query engine

    ### Messaging Services (PROD)
    - Kafka - Event streaming platform

    ### Pipeline Services (PROD)
    - Apache Airflow - Workflow orchestration
    - Apache Flink - Stream processing

    ### Dashboard Services (PROD)
    - Apache Superset - Data visualization and dashboards

    ### Storage Services
    - MinIO (via S3 connector) - Object storage

    ## How to Use These Configurations

    1. Access OpenMetadata UI at http://localhost:30585
    2. Navigate to Settings > Services
    3. Add new service using the JSON configurations below
    4. Replace placeholders with actual credentials

  postgresql-connector.json: |
    {
      "name": "openlakes-postgres",
      "serviceType": "Postgres",
      "description": "OpenLakes PostgreSQL Database",
      "connection": {
        "config": {
          "type": "Postgres",
          "scheme": "postgresql+psycopg2",
          "username": "{{ .Values.connectors.postgresql.config.username }}",
          "password": "REPLACE_WITH_ACTUAL_PASSWORD",
          "hostPort": "{{ .Values.connectors.postgresql.config.host }}:{{ .Values.connectors.postgresql.config.port }}",
          "database": "{{ .Values.connectors.postgresql.config.database }}",
          "sslMode": "disable",
          "classificationName": "OpenLakesClassification",
          "ingestAllDatabases": true,
          "connectionOptions": {},
          "connectionArguments": {},
          "supportsMetadataExtraction": true,
          "supportsUsageExtraction": true,
          "supportsLineageExtraction": true,
          "supportsDBTExtraction": false,
          "supportsProfiler": true,
          "supportsDatabase": true,
          "supportsQueryComment": true
        }
      }
    }

  trino-connector.json: |
    {
      "name": "openlakes-trino",
      "serviceType": "Trino",
      "description": "OpenLakes Trino Query Engine",
      "connection": {
        "config": {
          "type": "Trino",
          "username": "{{ .Values.connectors.trino.config.username }}",
          "hostPort": "{{ .Values.connectors.trino.config.host }}:{{ .Values.connectors.trino.config.port }}",
          "catalog": "{{ .Values.connectors.trino.config.catalog }}",
          "databaseSchema": "information_schema",
          "proxies": {},
          "connectionOptions": {},
          "connectionArguments": {},
          "supportsMetadataExtraction": true,
          "supportsUsageExtraction": true,
          "supportsLineageExtraction": true,
          "supportsDBTExtraction": false,
          "supportsProfiler": true,
          "supportsDatabase": true,
          "supportsQueryComment": true
        }
      }
    }

  kafka-connector.json: |
    {
      "name": "openlakes-kafka",
      "serviceType": "Kafka",
      "description": "OpenLakes Kafka Event Streaming",
      "connection": {
        "config": {
          "type": "Kafka",
          "bootstrapServers": "{{ .Values.connectors.kafka.config.bootstrapServers }}",
          "schemaRegistryURL": "",
          "saslUsername": "",
          "saslPassword": "",
          "saslMechanism": "PLAIN",
          "basicAuthUserInfo": "",
          "consumerConfig": {},
          "schemaRegistryConfig": {},
          "supportsMetadataExtraction": true
        }
      }
    }

  airflow-connector.json: |
    {
      "name": "openlakes-airflow",
      "serviceType": "Airflow",
      "description": "OpenLakes Airflow Orchestration",
      "connection": {
        "config": {
          "type": "Airflow",
          "hostPort": "{{ .Values.connectors.airflow.config.hostPort }}",
          "numberOfStatus": 10,
          "connection": {
            "type": "Backend"
          },
          "supportsMetadataExtraction": true
        }
      }
    }

  flink-connector.json: |
    {
      "name": "openlakes-flink",
      "serviceType": "Flink",
      "description": "OpenLakes Flink Stream Processing",
      "connection": {
        "config": {
          "type": "Flink",
          "hostPort": "{{ .Values.connectors.flink.config.hostPort }}",
          "supportsMetadataExtraction": true
        }
      }
    }

  superset-connector.json: |
    {
      "name": "openlakes-superset",
      "serviceType": "Superset",
      "description": "OpenLakes Superset Dashboards",
      "connection": {
        "config": {
          "type": "Superset",
          "hostPort": "{{ .Values.connectors.superset.config.hostPort }}",
          "connection": {
            "provider": "db",
            "username": "{{ .Values.connectors.superset.config.username }}",
            "password": "REPLACE_WITH_ACTUAL_PASSWORD"
          },
          "supportsMetadataExtraction": true
        }
      }
    }

  minio-s3-connector.json: |
    {
      "name": "openlakes-minio",
      "serviceType": "S3",
      "description": "OpenLakes MinIO Object Storage (S3-compatible)",
      "connection": {
        "config": {
          "type": "S3",
          "awsConfig": {
            "awsAccessKeyId": "{{ .Values.connectors.minio.config.awsAccessKeyId }}",
            "awsSecretAccessKey": "REPLACE_WITH_ACTUAL_SECRET_KEY",
            "awsRegion": "{{ .Values.connectors.minio.config.awsRegion }}",
            "endPointURL": "{{ .Values.connectors.minio.config.endPointURL }}"
          },
          "supportsMetadataExtraction": true
        }
      }
    }

  deployment-instructions.md: |
    # OpenMetadata Deployment Instructions

    ## Prerequisites

    1. Create OpenMetadata database in PostgreSQL:
       ```bash
       kubectl exec -n openlakes openlakes-postgres-0 -- \
         psql -U openlakes -c "CREATE DATABASE openmetadata;"
       ```

    2. Create Kubernetes secrets:
       ```bash
       kubectl create secret generic openmetadata-db-secrets \
         --from-literal=password=openlakes123 \
         -n openlakes
       ```

    ## Deployment Steps

    1. Add OpenMetadata Helm repository:
       ```bash
       helm repo add open-metadata https://helm.open-metadata.org/
       helm repo update
       ```

    2. Create custom values file (openmetadata-values.yaml):
       ```yaml
       global:
         postgresql:
           enabled: false
         elasticsearch:
           enabled: true

       openmetadata:
         config:
           database:
             enabled: false
           externalDatabase:
             enabled: true
             host: openlakes-postgres.openlakes.svc.cluster.local
             port: 5432
             databaseName: openmetadata
             username: openlakes
             secretRef: openmetadata-db-secrets
             secretKey: password
           pipelineServiceClientConfig:
             enabled: true
             className: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
             apiEndpoint: http://openlakes-airflow-webserver:8080
             metadataApiEndpoint: http://openmetadata:8585/api
             hostIp: ""
             verifySSL: "no-ssl"
             sslConfig:
               validate: false

       service:
         type: NodePort
         nodePort: 30585
       ```

    3. Install OpenMetadata:
       ```bash
       helm install openmetadata open-metadata/openmetadata \
         -f openmetadata-values.yaml \
         --namespace openlakes \
         --timeout 10m
       ```

    4. Wait for pods to be ready:
       ```bash
       kubectl wait --for=condition=ready pod \
         -l app.kubernetes.io/instance=openmetadata \
         -n openlakes \
         --timeout=600s
       ```

    5. Access OpenMetadata:
       - URL: http://localhost:30585
       - Default credentials: admin / admin

    ## Post-Deployment Configuration

    After OpenMetadata is running, configure connectors:

    1. Login to OpenMetadata UI
    2. Navigate to Settings > Services
    3. Add each service using the JSON configs from this ConfigMap
    4. Update passwords/secrets as needed
    5. Run metadata ingestion for each service

    ## Connector Setup Order

    Recommended order for adding connectors:

    1. **Databases First**: PostgreSQL, Trino
    2. **Messaging**: Kafka
    3. **Storage**: MinIO (S3)
    4. **Pipelines**: Airflow, Flink
    5. **Dashboards**: Superset

    ## Troubleshooting

    - Check OpenMetadata logs:
      ```bash
      kubectl logs -n openlakes -l app.kubernetes.io/instance=openmetadata
      ```

    - Verify database connection:
      ```bash
      kubectl exec -n openlakes deployment/openmetadata -- \
        nc -zv openlakes-postgres 5432
      ```

    - Check Elasticsearch status:
      ```bash
      kubectl get pods -n openlakes -l app=elasticsearch
      ```
{{- end }}
