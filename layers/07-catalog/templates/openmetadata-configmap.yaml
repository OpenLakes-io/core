{{- if .Values.openmetadata.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openlakes-catalog.fullname" . }}-openmetadata-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openmetadata
    component: config
data:
  openmetadata.yaml: |
    server:
      host: "0.0.0.0"
      port: 8585
      adminPort: 8586

    database:
      driverClass: {{ .Values.openmetadata.database.driverClass }}
      dbScheme: {{ .Values.openmetadata.database.dbScheme }}
      host: {{ .Values.openmetadata.database.host }}
      port: {{ .Values.openmetadata.database.port }}
      username: {{ .Values.openmetadata.database.username }}
      databaseName: {{ .Values.openmetadata.database.databaseName }}

    {{- if .Values.openmetadata.elasticsearch.enabled }}
    elasticsearch:
      host: {{ .Values.openmetadata.elasticsearch.host }}
      port: {{ .Values.openmetadata.elasticsearch.port }}
      scheme: {{ .Values.openmetadata.elasticsearch.scheme }}
      searchType: {{ .Values.openmetadata.elasticsearch.searchType }}
      trustStore:
        enabled: {{ .Values.openmetadata.elasticsearch.trustStore.enabled }}
    {{- end }}

    authentication:
      provider: {{ .Values.openmetadata.authentication.provider }}
      publicKeys: {{ .Values.openmetadata.authentication.publicKeys | toJson }}
      enableSelfSignup: {{ .Values.openmetadata.authentication.enableSelfSignup }}
      jwtPrincipalClaims: {{ .Values.openmetadata.authentication.jwtPrincipalClaims | toJson }}

    authorizer:
      className: {{ .Values.openmetadata.authorizer.className }}
      containerRequestFilter: {{ .Values.openmetadata.authorizer.containerRequestFilter }}
      initialAdmins: {{ .Values.openmetadata.authorizer.initialAdmins | toJson }}
      principalDomain: {{ .Values.openmetadata.authorizer.principalDomain }}

    secretsManager:
      provider: {{ .Values.openmetadata.secretsManager.provider }}
      prefix: {{ .Values.openmetadata.secretsManager.prefix }}
      tags: {{ .Values.openmetadata.secretsManager.tags | toJson }}

    {{- if .Values.openmetadata.pipelineServiceClient.enabled }}
    pipelineServiceClientConfig:
      enabled: true
      className: {{ .Values.openmetadata.pipelineServiceClient.className }}
      apiEndpoint: {{ .Values.openmetadata.pipelineServiceClient.apiEndpoint }}
      metadataApiEndpoint: {{ .Values.openmetadata.pipelineServiceClient.metadataApiEndpoint }}
    {{- else }}
    pipelineServiceClientConfig:
      enabled: false
      className: "org.openmetadata.service.clients.pipeline.noop.NoopClient"
    {{- end }}

    web:
      uriPath: {{ .Values.openmetadata.web.uriPath }}
      hsts:
        enabled: {{ .Values.openmetadata.web.hsts.enabled }}
        maxAge: {{ .Values.openmetadata.web.hsts.maxAge }}
        includeSubDomains: {{ .Values.openmetadata.web.hsts.includeSubDomains }}
        preload: {{ .Values.openmetadata.web.hsts.preload }}

    logLevel: {{ .Values.openmetadata.logLevel }}
{{- end }}
