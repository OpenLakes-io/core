{{- if .Values.openmetadata.enabled }}
{{- if .Values.openmetadata.automation.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openmetadata-service-registration
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openmetadata
    component: service-registration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: openmetadata
        component: service-registration
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-bot-token
        image: alpine:3.19
        command:
        - sh
        - -c
        - |
          echo "Waiting for bot token to be created..."
          for i in $(seq 1 60); do
            if [ -f /var/run/secrets/bot-token/token ]; then
              echo "✅ Bot token found!"
              exit 0
            fi
            echo "Attempt $i/60: Token not found, waiting..."
            sleep 5
          done
          echo "❌ Bot token not found after 5 minutes"
          exit 1
        volumeMounts:
        - name: bot-token
          mountPath: /var/run/secrets/bot-token
          readOnly: true
      - name: wait-for-services
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "Waiting for services to be ready..."
          sleep 60
          echo "✅ Services should be ready now"
      containers:
      - name: register-services
        image: alpine:3.19
        env:
        - name: OPENMETADATA_HOST
          value: "openmetadata"
        - name: OPENMETADATA_PORT
          value: "8585"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openmetadata-connector-credentials
              key: postgres-password
        - name: SUPERSET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openmetadata-connector-credentials
              key: superset-password
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: openmetadata-connector-credentials
              key: minio-secret-key
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: bot-token
          mountPath: /var/run/secrets/bot-token
          readOnly: true
        command:
        - sh
        - -c
        - |
          # Install dependencies
          apk add --no-cache curl jq

          # Run registration script
          chmod +x /scripts/register-services.sh
          /scripts/register-services.sh
      volumes:
      - name: scripts
        configMap:
          name: openmetadata-registration-scripts
          defaultMode: 0755
      - name: bot-token
        secret:
          secretName: openmetadata-bot-token
          optional: false
{{- end }}
{{- end }}
