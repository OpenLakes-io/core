{{- if .Values.ingestion.enabled }}
{{- $probeProfile := default "slow" .Values.openmetadata.probeProfile }}
{{- $wsLivenessInitial := 15 }}
{{- $wsLivenessPeriod := 30 }}
{{- $wsLivenessTimeout := 5 }}
{{- $wsLivenessFail := 3 }}
{{- $wsReadinessInitial := 15 }}
{{- $wsReadinessPeriod := 10 }}
{{- $wsReadinessTimeout := 5 }}
{{- $wsReadinessFail := 3 }}
{{- $schLivenessInitial := 15 }}
{{- $schLivenessPeriod := 30 }}
{{- $schLivenessTimeout := 10 }}
{{- $schLivenessFail := 5 }}

{{- if eq $probeProfile "medium" }}
  {{- $wsLivenessInitial = 45 }}
  {{- $wsLivenessTimeout = 10 }}
  {{- $wsLivenessFail = 6 }}
  {{- $wsReadinessInitial = 30 }}
  {{- $wsReadinessTimeout = 10 }}
  {{- $wsReadinessFail = 6 }}
  {{- $schLivenessInitial = 45 }}
  {{- $schLivenessFail = 8 }}
{{- end }}

{{- if eq $probeProfile "slow" }}
  {{- $wsLivenessInitial = 90 }}
  {{- $wsLivenessPeriod = 20 }}
  {{- $wsLivenessTimeout = 10 }}
  {{- $wsLivenessFail = 10 }}
  {{- $wsReadinessInitial = 60 }}
  {{- $wsReadinessPeriod = 15 }}
  {{- $wsReadinessTimeout = 10 }}
  {{- $wsReadinessFail = 10 }}
  {{- $schLivenessInitial = 90 }}
  {{- $schLivenessPeriod = 20 }}
  {{- $schLivenessTimeout = 10 }}
  {{- $schLivenessFail = 10 }}
{{- end }}
---
# PV Cleanup Hook - Removes stale PVs before installation/upgrade
# This ensures PVs are in Available state for binding to new PVCs
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-pv-cleanup
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: pv-cleanup
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ingestion
        component: pv-cleanup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.ingestion.fullnameOverride }}-pv-manager
      containers:
      - name: cleanup
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Checking for existing PVs..."

          # Delete PVs if they exist (they may be in Released state)
          for pv in {{ .Values.ingestion.fullnameOverride }}-dags-pv {{ .Values.ingestion.fullnameOverride }}-dag-configs-pv; do
            if kubectl get pv "$pv" 2>/dev/null; then
              echo "Deleting existing PV: $pv"
              kubectl delete pv "$pv" --ignore-not-found=true
            else
              echo "PV $pv does not exist, skipping"
            fi
          done

          echo "PV cleanup completed successfully"

---
# ServiceAccount for PV cleanup job (needs cluster-level PV permissions)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-pv-manager
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation

---
# ClusterRole for PV management
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-pv-manager
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "delete"]

---
# ClusterRoleBinding for PV management
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-pv-manager
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.ingestion.fullnameOverride }}-pv-manager
subjects:
- kind: ServiceAccount
  name: {{ .Values.ingestion.fullnameOverride }}-pv-manager
  namespace: {{ .Values.global.namespace }}

---
# DAGs PV - hostPath for RWX-like behavior on single node (development)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-dags-pv
spec:
  capacity:
    storage: {{ .Values.ingestion.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: null
  hostPath:
    path: /var/openlakes/airflow/dags
    type: DirectoryOrCreate

---
# DAGs PVC - needs RWX for shared access between scheduler, webserver, and workers
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-dags
  namespace: {{ .Values.global.namespace }}
  annotations:
    volume.beta.kubernetes.io/storage-class: ""
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.ingestion.persistence.size }}
  volumeName: {{ .Values.ingestion.fullnameOverride }}-dags-pv

---
# DAG Generated Configs PV - hostPath for RWX-like behavior
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-dag-configs-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: null
  hostPath:
    path: /var/openlakes/airflow/dag_generated_configs
    type: DirectoryOrCreate

---
# DAG Generated Configs PVC - RWX for OpenMetadata dynamic DAG configuration
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-dag-configs
  namespace: {{ .Values.global.namespace }}
  annotations:
    volume.beta.kubernetes.io/storage-class: ""
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: {{ .Values.ingestion.fullnameOverride }}-dag-configs-pv

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-db-migrate
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: db-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ingestion
        component: db-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-database
        image: postgres:16
        env:
        - name: PGPASSWORD
          value: "{{ .Values.ingestion.database.password }}"
        command:
        - sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h {{ .Values.ingestion.database.host }} -p {{ .Values.ingestion.database.port }} -U {{ .Values.ingestion.database.user }}; do
            echo "PostgreSQL not ready, waiting..."
            sleep 5
          done

          echo "Waiting for '{{ .Values.ingestion.database.name }}' database to exist..."
          until psql -h {{ .Values.ingestion.database.host }} -p {{ .Values.ingestion.database.port }} -U {{ .Values.ingestion.database.user }} -lqt | cut -d \| -f 1 | grep -qw {{ .Values.ingestion.database.name }}; do
            echo "Database '{{ .Values.ingestion.database.name }}' not found, waiting..."
            sleep 5
          done
          echo "Database '{{ .Values.ingestion.database.name }}' exists!"
      containers:
      - name: db-migrate
        image: {{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}
        imagePullPolicy: {{ .Values.ingestion.image.pullPolicy | default "IfNotPresent" }}
        command:
        - /bin/bash
        - -c
        - |
          # Run database migration
          airflow db migrate

          # Create admin user
          airflow users create \
            --username {{ .Values.ingestion.adminUser.username }} \
            --firstname {{ .Values.ingestion.adminUser.firstname }} \
            --lastname {{ .Values.ingestion.adminUser.lastname }} \
            --email {{ .Values.ingestion.adminUser.email }} \
            --role {{ .Values.ingestion.adminUser.role }} \
            --password {{ .Values.ingestion.adminUser.password }} || true
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.ingestion.database.user }}:{{ .Values.ingestion.database.password }}@{{ .Values.ingestion.database.host }}:{{ .Values.ingestion.database.port }}/{{ .Values.ingestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-webserver
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: webserver
spec:
  replicas: {{ .Values.ingestion.webserver.replicas }}
  selector:
    matchLabels:
      app: ingestion
      component: webserver
  template:
    metadata:
      labels:
        app: ingestion
        component: webserver
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          chown -R 50000:0 /opt/airflow/dags /opt/airflow/dag_generated_configs
          chmod -R 775 /opt/airflow/dags /opt/airflow/dag_generated_configs
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        - name: dag-configs
          mountPath: /opt/airflow/dag_generated_configs
      containers:
      - name: webserver
        image: {{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}
        imagePullPolicy: {{ .Values.ingestion.image.pullPolicy | default "IfNotPresent" }}
        command:
        - /bin/bash
        - -c
        - |
          # Wait for db init to complete
          echo "Waiting for database initialization to complete..."
          sleep 30

          # Start webserver
          airflow webserver
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.ingestion.database.user }}:{{ .Values.ingestion.database.password }}@{{ .Values.ingestion.database.host }}:{{ .Values.ingestion.database.port }}/{{ .Values.ingestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__API__AUTH_BACKENDS
          value: "airflow.api.auth.backend.basic_auth"
        - name: AIRFLOW__WEBSERVER__BASE_URL
          value: "http://localhost:8080"
        - name: AIRFLOW__WEBSERVER__WORKERS
          value: "2"
        - name: AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT
          value: "240"
        - name: AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT
          value: "240"
        - name: SERVER_HOST_API_URL
          value: "{{ .Values.ingestion.openmetadata.serverUrl }}/api"
        # MinIO Remote Logging Configuration
        - name: AIRFLOW__LOGGING__REMOTE_LOGGING
          value: "True"
        - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
          value: "s3://{{ .Values.ingestion.logging.bucket }}"
        - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
          value: "aws_default"
        - name: AIRFLOW__LOGGING__ENCRYPT_S3_LOGS
          value: "False"
        - name: AWS_ACCESS_KEY_ID
          value: "{{ .Values.ingestion.minio.accessKey }}"
        - name: AWS_SECRET_ACCESS_KEY
          value: "{{ .Values.ingestion.minio.secretKey }}"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: AWS_ENDPOINT_URL
          value: "http://infrastructure-minio:9000"
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        - name: dag-configs
          mountPath: /opt/airflow/dag_generated_configs
        resources:
          {{- toYaml .Values.ingestion.webserver.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: {{ $wsLivenessInitial }}
          periodSeconds: {{ $wsLivenessPeriod }}
          timeoutSeconds: {{ $wsLivenessTimeout }}
          failureThreshold: {{ $wsLivenessFail }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: {{ $wsReadinessInitial }}
          periodSeconds: {{ $wsReadinessPeriod }}
          timeoutSeconds: {{ $wsReadinessTimeout }}
          failureThreshold: {{ $wsReadinessFail }}
      volumes:
      - name: dags
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.fullnameOverride }}-dags
      - name: dag-configs
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.fullnameOverride }}-dag-configs

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingestion.fullnameOverride }}-scheduler
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: scheduler
spec:
  replicas: {{ .Values.ingestion.scheduler.replicas }}
  selector:
    matchLabels:
      app: ingestion
      component: scheduler
  template:
    metadata:
      labels:
        app: ingestion
        component: scheduler
    spec:
      initContainers:
      - name: create-minio-bucket
        image: minio/mc:latest
        command:
        - sh
        - -c
        - |
          set -e
          echo "Configuring MinIO client..."
          mc alias set myminio http://infrastructure-minio:9000 {{ .Values.ingestion.minio.accessKey }} {{ .Values.ingestion.minio.secretKey }}

          echo "Creating {{ .Values.ingestion.logging.bucket }} bucket if it doesn't exist..."
          if mc ls myminio/{{ .Values.ingestion.logging.bucket }} 2>/dev/null; then
            echo "Bucket {{ .Values.ingestion.logging.bucket }} already exists"
          else
            mc mb myminio/{{ .Values.ingestion.logging.bucket }}
            echo "Created bucket {{ .Values.ingestion.logging.bucket }}"
          fi
      - name: fix-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          chown -R 50000:0 /opt/airflow/dags /opt/airflow/dag_generated_configs
          chmod -R 775 /opt/airflow/dags /opt/airflow/dag_generated_configs
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        - name: dag-configs
          mountPath: /opt/airflow/dag_generated_configs
      containers:
      - name: scheduler
        image: {{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}
        imagePullPolicy: {{ .Values.ingestion.image.pullPolicy | default "IfNotPresent" }}
        command:
        - /bin/bash
        - -c
        - |
          # Wait for db init to complete
          echo "Waiting for database initialization to complete..."
          sleep 30

          # Start scheduler
          airflow scheduler
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.ingestion.database.user }}:{{ .Values.ingestion.database.password }}@{{ .Values.ingestion.database.host }}:{{ .Values.ingestion.database.port }}/{{ .Values.ingestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: SERVER_HOST_API_URL
          value: "{{ .Values.ingestion.openmetadata.serverUrl }}/api"
        # MinIO Remote Logging Configuration
        - name: AIRFLOW__LOGGING__REMOTE_LOGGING
          value: "True"
        - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
          value: "s3://{{ .Values.ingestion.logging.bucket }}"
        - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
          value: "aws_default"
        - name: AIRFLOW__LOGGING__ENCRYPT_S3_LOGS
          value: "False"
        - name: AWS_ACCESS_KEY_ID
          value: "{{ .Values.ingestion.minio.accessKey }}"
        - name: AWS_SECRET_ACCESS_KEY
          value: "{{ .Values.ingestion.minio.secretKey }}"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: AWS_ENDPOINT_URL
          value: "http://infrastructure-minio:9000"
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        - name: dag-configs
          mountPath: /opt/airflow/dag_generated_configs
        resources:
          {{- toYaml .Values.ingestion.scheduler.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              airflow jobs check --job-type SchedulerJob --hostname $(hostname)
          initialDelaySeconds: {{ $schLivenessInitial }}
          periodSeconds: {{ $schLivenessPeriod }}
          timeoutSeconds: {{ $schLivenessTimeout }}
          failureThreshold: {{ $schLivenessFail }}
      volumes:
      - name: dags
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.fullnameOverride }}-dags
      - name: dag-configs
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.fullnameOverride }}-dag-configs

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-openmetadata-ingestion
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: webserver
spec:
  type: {{ .Values.global.networking.type | default "ClusterIP" }}
  selector:
    app: ingestion
    component: webserver
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    {{- if eq (.Values.global.networking.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ .Values.ingestion.webserver.nodePort }}
    {{- end }}
{{- end }}
