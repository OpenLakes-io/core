{{- if .Values.openmetadata.enabled }}
{{- if .Values.openmetadata.automation.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmetadata-bot-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: openmetadata
    component: automation

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openmetadata-bot-role
  namespace: {{ .Values.global.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openmetadata-bot-rolebinding
  namespace: {{ .Values.global.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openmetadata-bot-role
subjects:
- kind: ServiceAccount
  name: openmetadata-bot-sa
  namespace: {{ .Values.global.namespace }}
{{- end }}
{{- end }}
