global:
  networking:
    type: NodePort
  storageClass: local-path
  namespace: openlakes

openmetadata:
  # OpenMetadata is deployed as part of this layer chart
  # No separate Helm chart installation required
  enabled: true
  fullnameOverride: 07-catalog-openmetadata

  nodePort: 30585

  # Image Configuration
  image:
    repository: docker.getcollate.io/openmetadata/server
    tag: "1.10.7"
    pullPolicy: IfNotPresent

  # Database Configuration (using existing OpenLakes PostgreSQL)
  database:
    host: postgres
    port: 5432
    databaseName: openmetadata
    username: openlakes
    password: openlakes123
    driverClass: org.postgresql.Driver
    dbScheme: postgresql
    dbParams: ""

  # OpenSearch/Elasticsearch Configuration (using OpenLakes OpenSearch)
  elasticsearch:
    enabled: true
    host: opensearch
    port: 9200
    scheme: http
    searchType: opensearch
    trustStore:
      enabled: false

  # Pipeline Service Client Configuration
  pipelineServiceClient:
    enabled: true
    className: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
    apiEndpoint: http://openmetadata-ingestion:8080
    metadataApiEndpoint: http://openmetadata-server:8585/api
    ingestionIpInfoEnabled: false
    hostIp: ""
    # Auth configuration for Airflow (uses basic auth)
    parameters:
      username: admin
      password: admin
      timeout: 10

  # Authentication Configuration
  authentication:
    provider: basic
    publicKeys:
      - "http://openmetadata-server:8585/api/v1/system/config/jwks"
    enableSelfSignup: true
    jwtPrincipalClaims:
      - email
      - preferred_username
      - sub

  # Authorizer Configuration
  authorizer:
    className: org.openmetadata.service.security.DefaultAuthorizer
    containerRequestFilter: org.openmetadata.service.security.JwtFilter
    initialAdmins:
      - admin
    principalDomain: open-metadata.org

  # Secrets Manager Configuration
  secretsManager:
    provider: db
    prefix: ""
    tags: []
    additionalParameters: {}

  # Web Configuration
  web:
    uriPath: /api
    hsts:
      enabled: true
      maxAge: "365 days"
      includeSubDomains: "true"
      preload: "true"

  # Logging
  logLevel: INFO

  # Resource Limits
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi

  # Probes Configuration
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 30
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

  startupProbe:
    periodSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  # Automated Service Registration
  automation:
    # Enable automated bot creation and service registration
    enabled: true

    # Admin credentials for bot creation (default: admin/admin)
    # Override with openmetadata-admin-secrets for production
    adminUser: admin
    # adminPassword: admin  # Managed via secret

    # Retry configuration
    retryAttempts: 3
    retryDelay: 10

# Connector Configurations for OpenLakes Components
connectors:
  # Database Connectors
  postgresql:
    enabled: true
    type: Postgres
    serviceType: Database
    config:
      host: postgres
      port: 5432
      username: openlakes
      database: postgres
      # Configure via UI or API after deployment

  trino:
    enabled: false  # Not deployed yet - deploy Layer 02-compute first
    type: Trino
    serviceType: Database
    config:
      host: trino
      port: 8080
      username: trino
      catalog: system

  # Messaging Connectors
  kafka:
    enabled: true
    type: Kafka
    serviceType: Messaging
    config:
      bootstrapServers: kafka:9092
      schemaRegistryURL: ""  # Optional if using schema registry

  # Pipeline Connectors
  airflow:
    enabled: false  # Not deployed yet - deploy Layer 04-orchestration first
    type: Airflow
    serviceType: Pipeline
    config:
      hostPort: http://airflow-webserver:8080
      # numberOfStatus: 10  # Number of status to display

  flink:
    enabled: false  # Not deployed yet - deploy Layer 03-streaming first
    type: Flink
    serviceType: Pipeline
    config:
      hostPort: http://flink-jobmanager:8081

  # Dashboard Connectors
  superset:
    enabled: false  # Not deployed yet - deploy Layer 05-analytics first
    type: Superset
    serviceType: Dashboard
    config:
      hostPort: http://superset:8088
      username: admin
      # password via secret

  # Storage Connectors (MinIO as S3)
  minio:
    enabled: true
    type: S3
    serviceType: StorageService
    config:
      awsAccessKeyId: admin
      awsRegion: us-east-1
      endPointURL: http://minio:9000
      # awsSecretAccessKey via secret

# Service Registration Configuration
# These services will be automatically registered with OpenMetadata
services:
  postgresql:
    enabled: true
    name: postgres
    description: OpenLakes PostgreSQL Database - Main operational database
    username: openlakes
    password: openlakes123
    host: postgres.openlakes.svc.cluster.local
    port: 5432
    database: openlakes

  trino:
    enabled: false  # Enable when Trino is deployed (Layer 02-compute)
    name: trino
    description: OpenLakes Trino - Distributed SQL query engine
    username: trino
    host: trino.openlakes.svc.cluster.local
    port: 8080
    catalog: hive

  starrocks:
    enabled: false  # Enable when StarRocks is deployed (Layer 02-compute)
    name: starrocks
    description: OpenLakes StarRocks - High-performance analytical database
    username: root
    host: starrocks-fe.openlakes.svc.cluster.local
    port: 9030
    database: default

  minio:
    enabled: true
    name: minio
    description: OpenLakes MinIO - S3-compatible object storage
    accessKey: admin
    secretKey: admin123
    region: us-east-1
    endpoint: http://minio.openlakes.svc.cluster.local:9000

  kafka:
    enabled: true
    name: kafka
    description: OpenLakes Kafka - Event streaming platform
    bootstrapServers: kafka.openlakes.svc.cluster.local:9092

  opensearch:
    enabled: true
    name: opensearch
    description: OpenLakes OpenSearch - Search and analytics engine
    endpoint: http://opensearch.openlakes.svc.cluster.local:9200

  airflow:
    enabled: false  # Enable when Airflow is deployed (Layer 04-orchestration)
    name: airflow
    description: OpenLakes Airflow - Workflow orchestration platform
    endpoint: http://airflow-webserver.openlakes.svc.cluster.local:8080

  superset:
    enabled: false  # Enable when Superset is deployed (Layer 05-analytics)
    name: superset
    description: OpenLakes Superset - Business intelligence platform
    endpoint: http://superset.openlakes.svc.cluster.local:8088
    username: admin
    password: admin
# OpenMetadata Ingestion (Airflow for metadata workflows)
ingestion:
  enabled: true
  fullnameOverride: 07-catalog-ingestion
  image:
    repository: openmetadata/ingestion
    tag: "1.10.7"
    pullPolicy: IfNotPresent
  webserver:
    nodePort: 30084
    replicas: 1
    resources:
      limits:
        memory: 2Gi
  scheduler:
    replicas: 1
    resources:
      limits:
        memory: 2Gi
  database:
    host: postgres
    port: 5432
    name: openmetadata_airflow
    user: openlakes
    password: openlakes123
  persistence:
    size: 10Gi
  adminUser:
    username: admin
    password: admin
    firstname: Admin
    lastname: User
    email: admin@openmetadata.org
    role: Admin
  openmetadata:
    serverUrl: http://openmetadata-server:8585

