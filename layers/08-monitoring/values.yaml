global:
  networking:
    type: Ingress
    ingressClass: traefik
    domain: openlakes.dev
    enableIngressRoutes: true  # Create Traefik IngressRoutes for hostname routing
  storageClass: longhorn
  namespace: openlakes
  # Optional tenant identifier for multi-tenant deployments
  tenant: ""
  # Service references (should match layer 01-infrastructure or be overridden)
  services:
    postgresql:
      host: infrastructure-postgres
      port: 5432
    kafka:
      host: infrastructure-kafka
      port: 9092
      bootstrapServers: infrastructure-kafka:9092

# ═══════════════════════════════════════════════════════════════
# Prometheus + Grafana + Alertmanager Stack
# ═══════════════════════════════════════════════════════════════
# Complete monitoring solution for Kubernetes and OpenLakes
# Includes pre-configured dashboards, alerts, and metrics collection
prometheus:
  enabled: true

kube-prometheus-stack:
  fullnameOverride: monitoring

  # ═══════════════════════════════════════════════════════════════
  # Grafana - Visualization and Dashboards
  # ═══════════════════════════════════════════════════════════════
  grafana:
    enabled: true
    fullnameOverride: monitoring-grafana

    # Admin credentials
    adminPassword: admin123  # Change in production!

    # Service configuration
    service:
      type: ClusterIP
      port: 3000

    # Ingress handled by Traefik IngressRoute (see templates/grafana-ingress.yaml)
    ingress:
      enabled: false

    # Persistence for dashboards
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: longhorn

    # Additional data sources
    additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://monitoring-loki:3100
      isDefault: false
      jsonData:
        maxLines: 1000

    # Dashboard providers
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: 'openlakes'
          orgId: 1
          folder: 'OpenLakes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/openlakes

    # Custom dashboards (loaded from configmaps)
    dashboardsConfigMaps:
      openlakes: "openlakes-grafana-dashboards"

    # Resources
#    resources:
#      requests:
#        cpu: 100m
#        memory: 128Mi
#      limits:
#        cpu: 500m
#        memory: 512Mi

  # ═══════════════════════════════════════════════════════════════
  # Prometheus - Metrics Collection and Storage
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    enabled: true

    prometheusSpec:
      # Retention
      retention: 15d
      retentionSize: "45GB"

      # Storage
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: longhorn
            resources:
              requests:
                storage: 50Gi

      # Resources
#      resources:
#        requests:
#          cpu: 500m
#          memory: 2Gi
#        limits:
#          cpu: 2000m
#          memory: 4Gi

      # Service monitors selector (match all)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

      # Additional scrape configs (if needed for non-standard endpoints)
      # OpenLakes components use ServiceMonitors (see templates/servicemonitors.yaml)
      additionalScrapeConfigs: []

  # ═══════════════════════════════════════════════════════════════
  # Alertmanager - Alert Routing
  # ═══════════════════════════════════════════════════════════════
  alertmanager:
    enabled: true

    config:
      global:
        resolve_timeout: 5m

      route:
        group_by: ['alertname', 'cluster', 'service', 'namespace']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'openlakes-default'
        routes:
        # High priority alerts (page immediately)
        - match:
            severity: critical
          receiver: 'openlakes-critical'
          repeat_interval: 5m
        # Medium priority (notify)
        - match:
            severity: warning
          receiver: 'openlakes-warning'
          repeat_interval: 30m

      receivers:
      - name: 'openlakes-default'
        # Configure in production:
        # webhook_configs:
        # - url: 'http://your-webhook-url'

      - name: 'openlakes-critical'
        # Configure in production:
        # slack_configs:
        # - api_url: 'YOUR_SLACK_WEBHOOK'
        #   channel: '#openlakes-critical'
        # pagerduty_configs:
        # - service_key: 'YOUR_PAGERDUTY_KEY'

      - name: 'openlakes-warning'
        # Configure in production:
        # slack_configs:
        # - api_url: 'YOUR_SLACK_WEBHOOK'
        #   channel: '#openlakes-alerts'

    alertmanagerSpec:
      replicas: 1
#      resources:
#        requests:
#          cpu: 10m
#          memory: 32Mi
#        limits:
#          cpu: 100m
#          memory: 128Mi

  # ═══════════════════════════════════════════════════════════════
  # Node Exporter - Node Metrics (CPU, RAM, Disk, Network)
  # ═══════════════════════════════════════════════════════════════
  nodeExporter:
    enabled: true
    tolerations: []  # avoid scheduling on control-plane-only nodes (rbp2)
  prometheus-node-exporter:
    tolerations: []  # strip broad Exists tolerance so tainted nodes are skipped
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: openlakes.io/role
              operator: NotIn
              values:
              - control-only

  # ═══════════════════════════════════════════════════════════════
  # Kube State Metrics - Kubernetes Object Metrics
  # ═══════════════════════════════════════════════════════════════
  kubeStateMetrics:
    enabled: true

  # ═══════════════════════════════════════════════════════════════
  # Default Service Monitors
  # ═══════════════════════════════════════════════════════════════
  kubeApiServer:
    enabled: true
  kubelet:
    enabled: true
  kubeControllerManager:
    enabled: true
  coreDns:
    enabled: true
  kubeEtcd:
    enabled: true
  kubeScheduler:
    enabled: true
  kubeProxy:
    enabled: true
  kubelet:
    enabled: true
    serviceMonitor:
      cAdvisor: true
      resource: true

# ═══════════════════════════════════════════════════════════════
# Loki - Log Aggregation
# ═══════════════════════════════════════════════════════════════
# Stores and queries logs from all containers
loki:
  enabled: true
  fullnameOverride: monitoring-loki

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    storage:
      type: 'filesystem'

    schemaConfig:
      configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h  # 7 days
    max_query_series: 10000
    max_query_parallelism: 16
    max_streams_per_user: 4000

  # Single binary mode (good for small/medium deployments)
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn

#    resources:
#      requests:
#        cpu: 100m
#        memory: 256Mi
#      limits:
#        cpu: 500m
#        memory: 1Gi

  # Explicitly disable other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Gateway configuration
  gateway:
    enabled: true
    nginxConfig:
      # RKE2 uses rke2-coredns instead of kube-dns
      # Use the ClusterIP of the CoreDNS service
      resolver: "10.43.0.10"

  # Ensure canary follows monitoring prefix while staying enabled
  canaryServiceAddress: "http://monitoring-loki-canary:3500/metrics"
  lokiCanary:
    enabled: true

# ═══════════════════════════════════════════════════════════════
# Promtail - Log Shipping (DaemonSet on each node)
# ═══════════════════════════════════════════════════════════════
promtail:
  enabled: true
  fullnameOverride: monitoring-promtail
  inotify:
    maxUserInstances: 8192
    maxUserWatches: 524288
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  initContainer:
    - name: promtail-sysctl
      image: busybox:1.36
      securityContext:
        privileged: true
      command:
        - sh
        - -c
        - |
          sysctl -w fs.inotify.max_user_instances={{ .Values.inotify.maxUserInstances | default 8192 }}
          sysctl -w fs.inotify.max_user_watches={{ .Values.inotify.maxUserWatches | default 524288 }}
  nodeSelector: {}

  config:
    clients:
    - url: http://monitoring-loki:3100/loki/api/v1/push

    snippets:
      pipelineStages:
      - docker: {}
      - multiline:
          # First line of a log entry (matches ISO timestamps)
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\S+) (?P<level>\S+) (?P<message>.*)'
      - labels:
          level:

#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 256Mi

# ═══════════════════════════════════════════════════════════════
# Kafka Exporter - Kafka Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes Kafka broker and consumer group metrics
kafkaExporter:
  enabled: true

kafka-exporter:
  fullnameOverride: monitoring-kafka-exporter

  # Kafka connection
  kafkaServer:
  - infrastructure-kafka:9092

  # SASL authentication (disabled for now)
  sasl:
    enabled: false

  # Service monitor
  prometheus:
    serviceMonitor:
      enabled: true
      namespace: openlakes
      additionalLabels:
        release: monitoring

#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 128Mi

# ═══════════════════════════════════════════════════════════════
# PostgreSQL Exporter - Database Metrics
# ═══════════════════════════════════════════════════════════════
postgresExporter:
  enabled: true

postgres-exporter:
  fullnameOverride: monitoring-postgres-exporter

  config:
    datasource:
      host: infrastructure-postgres
      port: "5432"
      user: openlakes
      password: openlakes123
      database: openlakes
      sslmode: disable

    # Auto-discover databases
    autoDiscoverDatabases: true

  # Service monitor
  serviceMonitor:
    enabled: true
    namespace: openlakes
    additionalLabels:
      release: monitoring

#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 128Mi

# ═══════════════════════════════════════════════════════════════
# NVIDIA DCGM Exporter - GPU Metrics
# ═══════════════════════════════════════════════════════════════
# Automatically enabled if GPUs are detected in cluster
# Exports: GPU utilization, memory, temperature, power, etc.
dcgmExporter:
  enabled: false  # Set to true by deploy script if GPUs detected
  fullnameOverride: monitoring-dcgm-exporter

  image:
    repository: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: "3.3.8-3.6.0-ubuntu22.04"
    pullPolicy: IfNotPresent

  # Deploy as DaemonSet on GPU nodes
  nodeSelector:
    nvidia.com/gpu: "true"

  # Tolerations for GPU nodes
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

  # Service for Prometheus scraping
  service:
    type: ClusterIP
    port: 9400

  # Resources
#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 128Mi

# ═══════════════════════════════════════════════════════════════
# Alluxio Monitoring
# ═══════════════════════════════════════════════════════════════
# Enable monitoring for Alluxio cache layer (if deployed)
# Automatically enabled if Alluxio is enabled in infrastructure layer
alluxioMonitor:
  enabled: false  # Set to true if Alluxio is deployed

# ═══════════════════════════════════════════════════════════════
# StatsD Exporter - Airflow Metrics Bridge
# ═══════════════════════════════════════════════════════════════
# Receives StatsD metrics from Airflow and exposes as Prometheus metrics
# Required for Airflow orchestration monitoring
statsdExporter:
  enabled: true

statsd-exporter:
  fullnameOverride: monitoring-statsd-exporter

  # Service configuration
  service:
    type: ClusterIP
    port: 9102  # Prometheus metrics port
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9102"

  # StatsD UDP listener configuration
  statsd:
    udpPort: 9125  # Airflow sends metrics here
    tcpPort: 9125
    eventFlushInterval: 200ms

  # Service monitor for Prometheus
  serviceMonitor:
    enabled: true
    namespace: openlakes
    additionalLabels:
      release: monitoring

  # Mapping configuration for Airflow metrics
  # Converts StatsD metric names to Prometheus format
  extraArgs: []
  extraVolumes: []
  extraVolumeMounts: []

  image:
    repository: prom/statsd-exporter
    tag: v0.28.0
  # Resources
#  resources:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#    limits:
#      cpu: 200m
#      memory: 128Mi
