---
# ═══════════════════════════════════════════════════════════════
# StatsD Mapping Configuration for Airflow Metrics
# ═══════════════════════════════════════════════════════════════
# Converts Airflow StatsD metric names to Prometheus format
#
# Airflow StatsD metrics format:
#   airflow.{component}.{metric_name}.{dag_id}.{task_id}
#
# Prometheus format:
#   airflow_{component}_{metric_name}{dag_id="...",task_id="..."}
#
# Reference: https://airflow.apache.org/docs/apache-airflow/stable/logging-monitoring/metrics.html

apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-statsd-mapping
  namespace: {{ .Values.global.namespace }}
  labels:
    app: statsd-exporter
    layer: monitoring
data:
  statsd-mapping.conf: |
    # ════════════════════════════════════════════════════════════════
    # Airflow DAG and Task Metrics
    # ════════════════════════════════════════════════════════════════

    # DAG run success/failure
    mappings:
    - match: "airflow.dagrun.duration.success.*.*"
      name: "airflow_dagrun_duration_seconds"
      labels:
        dag_id: "$1"
        run_type: "$2"
      timer_type: histogram

    - match: "airflow.dagrun.duration.failed.*.*"
      name: "airflow_dagrun_duration_seconds"
      labels:
        dag_id: "$1"
        run_type: "$2"
        status: "failed"
      timer_type: histogram

    # Task instance duration
    - match: "airflow.task_instance_duration.success.*.*"
      name: "airflow_task_instance_duration_seconds"
      labels:
        dag_id: "$1"
        task_id: "$2"
        status: "success"
      timer_type: histogram

    - match: "airflow.task_instance_duration.failed.*.*"
      name: "airflow_task_instance_duration_seconds"
      labels:
        dag_id: "$1"
        task_id: "$2"
        status: "failed"
      timer_type: histogram

    # Task instance state counts
    - match: "airflow.task_instance.*.*.success"
      name: "airflow_task_instance_count"
      labels:
        dag_id: "$1"
        task_id: "$2"
        state: "success"

    - match: "airflow.task_instance.*.*.failed"
      name: "airflow_task_instance_count"
      labels:
        dag_id: "$1"
        task_id: "$2"
        state: "failed"

    - match: "airflow.task_instance.*.*.skipped"
      name: "airflow_task_instance_count"
      labels:
        dag_id: "$1"
        task_id: "$2"
        state: "skipped"

    # ════════════════════════════════════════════════════════════════
    # Airflow Scheduler Metrics
    # ════════════════════════════════════════════════════════════════

    - match: "airflow.scheduler.heartbeat"
      name: "airflow_scheduler_heartbeat"

    - match: "airflow.scheduler.tasks.running"
      name: "airflow_scheduler_tasks_running"

    - match: "airflow.scheduler.tasks.starving"
      name: "airflow_scheduler_tasks_starving"

    - match: "airflow.scheduler.tasks.executable"
      name: "airflow_scheduler_tasks_executable"

    - match: "airflow.scheduler.critical_section_duration"
      name: "airflow_scheduler_critical_section_duration_seconds"
      timer_type: histogram

    # ════════════════════════════════════════════════════════════════
    # Airflow Executor Metrics
    # ════════════════════════════════════════════════════════════════

    - match: "airflow.executor.open_slots"
      name: "airflow_executor_open_slots"

    - match: "airflow.executor.queued_tasks"
      name: "airflow_executor_queued_tasks"

    - match: "airflow.executor.running_tasks"
      name: "airflow_executor_running_tasks"

    # ════════════════════════════════════════════════════════════════
    # Airflow Pool Metrics
    # ════════════════════════════════════════════════════════════════

    - match: "airflow.pool.open_slots.*"
      name: "airflow_pool_open_slots"
      labels:
        pool: "$1"

    - match: "airflow.pool.queued_slots.*"
      name: "airflow_pool_queued_slots"
      labels:
        pool: "$1"

    - match: "airflow.pool.running_slots.*"
      name: "airflow_pool_running_slots"
      labels:
        pool: "$1"

    # ════════════════════════════════════════════════════════════════
    # Airflow DAG Processing Metrics
    # ════════════════════════════════════════════════════════════════

    - match: "airflow.dag_processing.last_duration.*"
      name: "airflow_dag_processing_last_duration_seconds"
      labels:
        dag_file: "$1"

    - match: "airflow.dag_processing.last_run.seconds_ago.*"
      name: "airflow_dag_processing_last_run_seconds_ago"
      labels:
        dag_file: "$1"

    - match: "airflow.dag_processing.import_errors"
      name: "airflow_dag_processing_import_errors"

    # ════════════════════════════════════════════════════════════════
    # Airflow Database Metrics
    # ════════════════════════════════════════════════════════════════

    - match: "airflow.dag.*.*.duration"
      name: "airflow_dag_task_duration_seconds"
      labels:
        dag_id: "$1"
        task_id: "$2"
      timer_type: histogram

    # Default catch-all for other Airflow metrics
    - match: "airflow.*.*"
      name: "airflow_${1}_${2}"

    - match: "airflow.*.*.*"
      name: "airflow_${1}_${2}"
      labels:
        label: "$3"
