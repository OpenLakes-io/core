  namespace: {{ .Values.global.namespace }}
  labels:
    app: alluxio
    component: worker
    layer: infrastructure
    release: monitoring
spec:
  selector:
    matchLabels:
      app: alluxio
      component: worker
  endpoints:
  - port: metrics
    path: /metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
{{- end }}

---
# ═══════════════════════════════════════════════════════════════
# Airflow Metrics (via StatsD Exporter)
# ═══════════════════════════════════════════════════════════════
# Airflow sends metrics to StatsD exporter via UDP port 9125
# StatsD exporter converts metrics to Prometheus format
#
# Configured in:
#   - Layer 04 (Orchestration): Airflow statsd.enabled=true
#   - Layer 08 (Monitoring): StatsD exporter with serviceMonitor
#
# Metrics include:
#   - DAG run success/failure rates and duration
#   - Task instance states and execution times
#   - Scheduler heartbeat and task queues
#   - Executor open/queued/running tasks
#   - Pool utilization
#
# Access metrics at: http://monitoring-statsd-exporter:9102/metrics
# ServiceMonitor: Automatically created by statsd-exporter chart
#
# ═══════════════════════════════════════════════════════════════

---
# ═══════════════════════════════════════════════════════════════
# NOTE: Superset, OpenMetadata ServiceMonitors Not Configured
# ═══════════════════════════════════════════════════════════════
# These services require additional configuration to expose Prometheus metrics:
#
# - Superset: Does not expose Prometheus metrics by default
#   Requires custom metrics exporter or StatsD integration
#
# - OpenMetadata: Metrics endpoint availability uncertain
#   May require additional configuration or plugin
#
# To add metrics for these services in the future:
# 1. Configure the application to expose metrics
# 2. Add corresponding ServiceMonitor in this file
# 3. Update Grafana dashboards accordingly
#
# ═══════════════════════════════════════════════════════════════

---
# ═══════════════════════════════════════════════════════════════
# Traefik - Ingress Controller Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes request rates, response times, backend health
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-traefik
  namespace: {{ .Values.global.namespace }}
  labels:
    app: traefik
    layer: infrastructure
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  endpoints:
  - port: traefik
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
