  labels:
    app: nessie
    layer: infrastructure
    release: monitoring
spec:
  selector:
    matchLabels:
      app: nessie
  endpoints:
  - port: http
    path: /q/metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}

---
# ═══════════════════════════════════════════════════════════════
# Alluxio Master - Cache Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes cache hit rates, I/O throughput, tier statistics
{{- if .Values.alluxioMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-alluxio-master
  namespace: {{ .Values.global.namespace }}
  labels:
    app: alluxio
    component: master
    layer: infrastructure
    release: monitoring
spec:
  selector:
    matchLabels:
      app: alluxio
      component: master
  endpoints:
  - port: metrics
    path: /metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
{{- end }}

---
