---
# ═══════════════════════════════════════════════════════════════
# OpenLakes Service Monitors
# ═══════════════════════════════════════════════════════════════
# Configure Prometheus to scrape metrics from OpenLakes components
#
# Components with built-in Prometheus metrics:
#   - MinIO: Cluster metrics, bucket stats, network I/O
#   - Spark: Master/worker metrics, application stats
#   - Trino: Query metrics, resource usage
#   - Alluxio: Cache hit rates, I/O throughput
#   - Nessie: API metrics, catalog operations
#
# Note: Kafka and PostgreSQL use dedicated exporters
# (configured in Chart.yaml dependencies)

# ═══════════════════════════════════════════════════════════════
# MinIO - Object Storage Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes cluster health, bucket statistics, network I/O
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-minio
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
    layer: infrastructure
    release: monitoring
spec:
  selector:
    matchLabels:
      app: minio
  endpoints:
  - port: http
    path: /minio/v2/metrics/cluster
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}

---
# ═══════════════════════════════════════════════════════════════
# Spark Master - Cluster Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes master stats, worker status, running applications
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-spark-master
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    component: master
    layer: compute
    release: monitoring
spec:
  selector:
    matchLabels:
      app: spark
      component: master
  endpoints:
  - port: webui
    path: /metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}

---
# ═══════════════════════════════════════════════════════════════
# Spark Worker - Executor Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes worker resource usage, executor stats
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-spark-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    component: worker
    layer: compute
    release: monitoring
spec:
  selector:
    matchLabels:
      app: spark
      component: worker
  endpoints:
  - port: webui
    path: /metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}

---
# ═══════════════════════════════════════════════════════════════
# Trino - Query Engine Metrics
# ═══════════════════════════════════════════════════════════════
# Exposes query statistics, resource utilization, coordinator stats (via JMX exporter)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlakes-trino
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trino
    layer: compute
    release: monitoring
spec:
  selector:
    matchLabels:
      app: trino
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}

---
