# ════════════════════════════════════════════════════════════════
# OpenLakes Layer 02 - Compute
# STAGING Environment Overrides
# ════════════════════════════════════════════════════════════════
#
# Purpose: QA, regression testing, customer feedback before production
#
# Usage:
#   ./deploy-openlakes.sh --env staging
#   # OR
#   helm upgrade --install 02-compute ./layers/02-compute \
#     --namespace openlakes \
#     -f ./layers/02-compute/values.yaml \
#     -f ./layers/02-compute/values-staging.yaml
#
# Workflow:
#   OpenLakes Core uses vanilla Apache Spark
#   For S3A support, use --packages at runtime (see examples/)
#   For automated lineage, use OpenLakes Pier instead of Core
#
# ════════════════════════════════════════════════════════════════

spark:
  image:
    # Core uses official Apache Spark (no custom image)
    repository: apache/spark
    tag: "4.1.0-preview3"
    pullPolicy: IfNotPresent
