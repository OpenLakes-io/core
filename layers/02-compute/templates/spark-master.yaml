{{- if .Values.spark.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.spark.fullnameOverride }}-master
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    component: master
    layer: compute
    {{- with .Values.global.tenant }}
    openlakes.io/tenant: {{ . }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      component: master
  template:
    metadata:
      labels:
        app: spark
        component: master
        layer: compute
        {{- with .Values.global.tenant }}
        openlakes.io/tenant: {{ . }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.spark.fullnameOverride }}-sa
      containers:
      - name: spark-master
        image: {{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag }}
        imagePullPolicy: {{ .Values.spark.image.pullPolicy }}
        command:
          - "/bin/bash"
          - "-c"
          - |
            # Start Spark master and keep container running
            /opt/spark/sbin/start-master.sh
            tail -f /opt/spark/logs/spark-*-master-*.out
        ports:
        - containerPort: 7077
          name: master
          protocol: TCP
        - containerPort: 8080
          name: webui
          protocol: TCP
        - containerPort: 4040
          name: driver-ui
          protocol: TCP
        env:
        - name: SPARK_MODE
          value: "master"
        - name: SPARK_MASTER_HOST
          value: "0.0.0.0"
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: SPARK_MASTER_WEBUI_PORT
          value: "8080"
        - name: SPARK_DAEMON_MEMORY
          value: {{ .Values.spark.master.daemonMemory }}
        - name: SPARK_PUBLIC_DNS
          value: {{ .Values.spark.fullnameOverride }}-master.{{ .Values.global.namespace }}.svc.cluster.local
        - name: SPARK_CONF_DIR
          value: "/opt/spark/conf"
        - name: SPARK_LOG_DIR
          value: "/opt/spark/logs"
        - name: SPARK_LOG_MAX_FILES
          value: "5"
        - name: SPARK_PID_DIR
          value: "/tmp"
        - name: SPARK_METRICS_CONF
          value: "/opt/spark/conf/metrics.properties"
        # Kubernetes-specific configurations
        {{- if .Values.spark.openmetadata.enabled }}
        # ════════════════════════════════════════════════════════════════
        # OpenMetadata Integration (OpenLakes v1.0.0)
        # ════════════════════════════════════════════════════════════════
        # Injects openlakesbot JWT token for automated lineage capture
        - name: SPARK_OPENMETADATA_JWT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.spark.fullnameOverride }}-openmetadata
              key: jwt-token
              optional: false
        # Inject JWT token into Spark properties via SPARK_SUBMIT_OPTS
        # This makes the token available to the OpenLineage OpenMetadata transporter
        - name: SPARK_SUBMIT_OPTS
          value: >-
            -Dspark.master=spark://{{ .Values.spark.fullnameOverride }}-master:7077
            -Dspark.openlineage.transport.auth.apiKey=$(SPARK_OPENMETADATA_JWT_TOKEN)
        {{- else }}
        - name: SPARK_SUBMIT_OPTS
          value: "-Dspark.master=spark://{{ .Values.spark.fullnameOverride }}-master:7077"
        {{- end }}
        resources:
          {{- toYaml .Values.spark.master.resources | nindent 10 }}
        volumeMounts:
        - name: spark-config
          mountPath: /opt/spark/conf
        - name: spark-logs
          mountPath: /opt/spark/logs
        livenessProbe:
          tcpSocket:
            port: 7077
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 7077
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: spark-config
        configMap:
          name: {{ .Values.spark.fullnameOverride }}-config
      - name: spark-logs
        emptyDir: {}
{{- end }}