{{- if .Values.spark.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spark.fullnameOverride }}-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    layer: compute
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.spark.fullnameOverride }}-role
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    layer: compute
rules:
  # Permissions for Spark driver to create and manage executor pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]

  # Permissions for pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

  # Permissions for pod status
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch"]

  # Permissions for ConfigMaps (for dynamic allocation and shuffle service)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permissions for Services (for driver service and shuffle service)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Permissions for PersistentVolumeClaims (if using persistent storage)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]

  # Permissions for Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.spark.fullnameOverride }}-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark
    layer: compute
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.spark.fullnameOverride }}-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.spark.fullnameOverride }}-sa
    namespace: {{ .Values.global.namespace }}

{{- if .Values.spark.openmetadata.enabled }}
---
# ClusterRole for cross-namespace secret access
# Allows Spark to read openlakesbot token from catalog namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.spark.fullnameOverride }}-om-token-reader
  labels:
    app: spark
    layer: compute
    version: "1.0.0"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "openmetadata-bot-token"  # openlakesbot token in catalog namespace
  verbs: ["get", "list"]
  # Note: This permission is scoped to specific secret name for security

---
# ClusterRoleBinding to grant Spark SA cross-namespace token access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.spark.fullnameOverride }}-om-token-reader
  labels:
    app: spark
    layer: compute
    version: "1.0.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.spark.fullnameOverride }}-om-token-reader
subjects:
- kind: ServiceAccount
  name: {{ .Values.spark.fullnameOverride }}-sa
  namespace: {{ .Values.global.namespace }}
{{- end }}
{{- end }}