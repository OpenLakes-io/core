{{- if .Values.global.networking.enableIngressRoutes }}
---
# ═══════════════════════════════════════════════════════════════
# Trino - Ingress Route
# ═══════════════════════════════════════════════════════════════
# Access Trino UI at: http://trino.openlakes.local
{{- if .Values.trino.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: compute-trino
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trino
    layer: compute
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`trino.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: compute-trino
          port: 8080  # Trino coordinator UI port
{{- end }}

