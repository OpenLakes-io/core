---
# ═══════════════════════════════════════════════════════════════
# Trino - Secure Ingress Route (HTTPS)
# ═══════════════════════════════════════════════════════════════
# Access Trino UI at: https://trino.openlakes.dev
{{- if .Values.trino.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: compute-trino-secure
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trino
    layer: compute
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`trino.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: compute-trino
          port: 8080
  tls:
    certResolver: letsencrypt
    domains:
      - main: trino.{{ .Values.global.networking.domain }}
{{- end }}

