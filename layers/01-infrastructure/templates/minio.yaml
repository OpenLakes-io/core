{{- if .Values.minio.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.minio.fullnameOverride }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
    component: storage
spec:
  serviceName: {{ .Values.minio.fullnameOverride }}
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        component: storage
    spec:
      containers:
      - name: minio
        image: {{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /data/openlakes
          minio server /data --console-address :9001
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.auth.rootUser }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.auth.rootPassword }}
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.global.storageClass }}
      resources:
        requests:
          storage: {{ .Values.minio.persistence.size }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.fullnameOverride }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
spec:
  type: {{ .Values.minio.service.type | default "ClusterIP" }}
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
    {{- if eq (.Values.minio.service.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ .Values.minio.service.nodePort }}
    {{- end }}
  - name: console
    port: 9001
    targetPort: 9001
{{- end }}
