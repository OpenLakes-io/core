{{- if and .Values.traefik.enabled .Values.global.networking.enableIngressRoutes }}
{{- if .Values.traefik.certResolver.cloudflare.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{ .Values.global.namespace }}
  labels:
    layer: infrastructure
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
