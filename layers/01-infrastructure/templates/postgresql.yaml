{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgresql.fullnameOverride }}-init
  namespace: {{ .Values.global.namespace }}
data:
  init.sql: |
    -- Create databases for various services
    CREATE DATABASE IF NOT EXISTS airflow;
    CREATE DATABASE IF NOT EXISTS superset;
    CREATE DATABASE IF NOT EXISTS openmetadata;

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.fullnameOverride }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgresql
    component: database
spec:
  serviceName: {{ .Values.postgresql.fullnameOverride }}
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      containers:
      - name: postgresql
        image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.auth.database }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgresql.auth.password }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgresql
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.auth.username }}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-scripts
        configMap:
          name: {{ .Values.postgresql.fullnameOverride }}-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.global.storageClass }}
      resources:
        requests:
          storage: {{ .Values.postgresql.persistence.size }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.fullnameOverride }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgresql
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
{{- end }}
