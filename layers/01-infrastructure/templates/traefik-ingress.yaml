{{- if and (or .Values.traefik.enabled .Values.traefik.useExisting) .Values.global.networking.enableIngressRoutes }}
---
# ═══════════════════════════════════════════════════════════════
# MinIO Console - Ingress Routes (HTTP + HTTPS)
# ═══════════════════════════════════════════════════════════════
# HTTP route - redirects to HTTPS if Let's Encrypt enabled
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infrastructure-minio
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
    layer: infrastructure
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: infrastructure-minio
          port: 9001
{{- if .Values.traefik.certResolver.cloudflare.enabled }}
      middlewares:
        - name: redirect-https
          namespace: {{ .Values.global.namespace }}
{{- end }}

{{- if .Values.traefik.certResolver.cloudflare.enabled }}
---
# HTTPS route with Let's Encrypt certificate
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infrastructure-minio-secure
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
    layer: infrastructure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: infrastructure-minio
          port: 9001
  tls:
    certResolver: letsencrypt
    domains:
      - main: minio.{{ .Values.global.networking.domain }}
{{- end }}

