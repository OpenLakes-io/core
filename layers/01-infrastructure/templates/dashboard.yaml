{{- if .Values.dashboard.enabled }}
{{- $dashboardName := .Values.dashboard.fullnameOverride | default "infrastructure-dashboard" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $dashboardName }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "infrastructure.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "infrastructure.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
      - name: dashboard
        image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        env:
        - name: OPENLAKES_PROTOCOL
          value: {{ .Values.dashboard.env.protocol | quote }}
        - name: OPENLAKES_DOMAIN
          value: {{ .Values.dashboard.env.domain | quote }}
        - name: OPENLAKES_PORT
          value: {{ .Values.dashboard.env.port | quote }}
        - name: OPENLAKES_SERVICES_B64
          value: {{ .Values.dashboard.env.servicesB64 | quote }}
        - name: OPENLAKES_SHOW_CREDENTIALS
          value: {{ .Values.dashboard.env.showCredentials | quote }}
        - name: OPENLAKES_VERSION
          value: {{ .Values.dashboard.env.version | quote }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.dashboard.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $dashboardName }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
  - port: {{ .Values.dashboard.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
    nodePort: {{ .Values.dashboard.service.nodePort }}
    {{- end }}
  selector:
    {{- include "infrastructure.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}


