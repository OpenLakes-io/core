{{- if .Values.notebooks.bucket }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orchestration-airflow-notebook-sync
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow-notebook-sync
spec:
  schedule: {{ .Values.notebooks.sync.airflowSchedule | default "*/3 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: airflow-notebook-sync
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 50000
            fsGroupChangePolicy: OnRootMismatch
          containers:
          - name: sync
            image: minio/mc:latest
            env:
            - name: MINIO_ENDPOINT
              value: {{ .Values.global.minio.endpoint | default "http://infrastructure-minio:9000" | quote }}
            - name: MINIO_ROOT_USER
              value: {{ .Values.global.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.global.minio.rootPassword | quote }}
            - name: NOTEBOOK_BUCKET
              value: {{ .Values.notebooks.bucket | quote }}
            - name: NOTEBOOK_SHARED_PREFIX
              value: {{ .Values.notebooks.prefixes.shared | default "shared" | quote }}
            - name: NOTEBOOK_PUBLISHED_PREFIX
              value: {{ .Values.notebooks.prefixes.published | default "published" | quote }}
            command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              alias mc='/usr/bin/mc --quiet'
              mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
              mkdir -p /opt/airflow/dags/examples
              mkdir -p /opt/airflow/dags/published
              mc mirror --overwrite "minio/${NOTEBOOK_BUCKET}/${NOTEBOOK_SHARED_PREFIX}" /opt/airflow/dags/examples
              mc mirror --overwrite "minio/${NOTEBOOK_BUCKET}/${NOTEBOOK_PUBLISHED_PREFIX}" /opt/airflow/dags/published
              chown -R 50000:0 /opt/airflow/dags
            volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
          volumes:
          - name: dags
            persistentVolumeClaim:
              claimName: {{ .Values.airflow.fullnameOverride }}-dags
{{- end }}
