{{- if .Values.openmetadataIngestion.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.openmetadataIngestion.fullnameOverride }}-dags
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.openmetadataIngestion.persistence.size }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.openmetadataIngestion.fullnameOverride }}-db-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: db-init
spec:
  template:
    metadata:
      labels:
        app: ingestion
        component: db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-database
        image: postgres:16
        env:
        - name: PGPASSWORD
          value: "{{ .Values.openmetadataIngestion.database.password }}"
        command:
        - sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h {{ .Values.openmetadataIngestion.database.host }} -p {{ .Values.openmetadataIngestion.database.port }} -U {{ .Values.openmetadataIngestion.database.user }}; do
            echo "PostgreSQL not ready, waiting..."
            sleep 5
          done

          echo "Waiting for '{{ .Values.openmetadataIngestion.database.name }}' database to exist..."
          until psql -h {{ .Values.openmetadataIngestion.database.host }} -p {{ .Values.openmetadataIngestion.database.port }} -U {{ .Values.openmetadataIngestion.database.user }} -lqt | cut -d \| -f 1 | grep -qw {{ .Values.openmetadataIngestion.database.name }}; do
            echo "Database '{{ .Values.openmetadataIngestion.database.name }}' not found, waiting..."
            sleep 5
          done
          echo "Database '{{ .Values.openmetadataIngestion.database.name }}' exists!"
      containers:
      - name: db-init
        image: {{ .Values.openmetadataIngestion.image.repository }}:{{ .Values.openmetadataIngestion.image.tag }}
        command:
        - /bin/bash
        - -c
        - |
          # Run database migration
          airflow db migrate

          # Create admin user
          airflow users create \
            --username {{ .Values.openmetadataIngestion.adminUser.username }} \
            --firstname {{ .Values.openmetadataIngestion.adminUser.firstname }} \
            --lastname {{ .Values.openmetadataIngestion.adminUser.lastname }} \
            --email {{ .Values.openmetadataIngestion.adminUser.email }} \
            --role {{ .Values.openmetadataIngestion.adminUser.role }} \
            --password {{ .Values.openmetadataIngestion.adminUser.password }} || true
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.openmetadataIngestion.database.user }}:{{ .Values.openmetadataIngestion.database.password }}@{{ .Values.openmetadataIngestion.database.host }}:{{ .Values.openmetadataIngestion.database.port }}/{{ .Values.openmetadataIngestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.openmetadataIngestion.fullnameOverride }}-webserver
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: webserver
spec:
  replicas: {{ .Values.openmetadataIngestion.webserver.replicas }}
  selector:
    matchLabels:
      app: ingestion
      component: webserver
  template:
    metadata:
      labels:
        app: openmetadata-ingestion
        component: webserver
    spec:
      containers:
      - name: webserver
        image: {{ .Values.openmetadataIngestion.image.repository }}:{{ .Values.openmetadataIngestion.image.tag }}
        command:
        - /bin/bash
        - -c
        - |
          # Wait for db init to complete
          echo "Waiting for database initialization to complete..."
          sleep 30

          # Start webserver
          airflow webserver
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.openmetadataIngestion.database.user }}:{{ .Values.openmetadataIngestion.database.password }}@{{ .Values.openmetadataIngestion.database.host }}:{{ .Values.openmetadataIngestion.database.port }}/{{ .Values.openmetadataIngestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__API__AUTH_BACKENDS
          value: "airflow.api.auth.backend.basic_auth"
        - name: AIRFLOW__WEBSERVER__BASE_URL
          value: "http://localhost:8080"
        - name: SERVER_HOST_API_URL
          value: "{{ .Values.openmetadataIngestion.openmetadata.serverUrl }}/api"
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        resources:
          {{- toYaml .Values.openmetadataIngestion.webserver.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: dags
        persistentVolumeClaim:
          claimName: {{ .Values.openmetadataIngestion.fullnameOverride }}-dags

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.openmetadataIngestion.fullnameOverride }}-scheduler
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: scheduler
spec:
  replicas: {{ .Values.openmetadataIngestion.scheduler.replicas }}
  selector:
    matchLabels:
      app: openmetadata-ingestion
      component: scheduler
  template:
    metadata:
      labels:
        app: openmetadata-ingestion
        component: scheduler
    spec:
      containers:
      - name: scheduler
        image: {{ .Values.openmetadataIngestion.image.repository }}:{{ .Values.openmetadataIngestion.image.tag }}
        command:
        - /bin/bash
        - -c
        - |
          # Wait for db init to complete
          echo "Waiting for database initialization to complete..."
          sleep 30

          # Start scheduler
          airflow scheduler
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "postgresql+psycopg2://{{ .Values.openmetadataIngestion.database.user }}:{{ .Values.openmetadataIngestion.database.password }}@{{ .Values.openmetadataIngestion.database.host }}:{{ .Values.openmetadataIngestion.database.port }}/{{ .Values.openmetadataIngestion.database.name }}"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "LocalExecutor"
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "False"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: SERVER_HOST_API_URL
          value: "{{ .Values.openmetadataIngestion.openmetadata.serverUrl }}/api"
        volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        resources:
          {{- toYaml .Values.openmetadataIngestion.scheduler.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              airflow jobs check --job-type SchedulerJob --hostname $(hostname)
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: dags
        persistentVolumeClaim:
          claimName: {{ .Values.openmetadataIngestion.fullnameOverride }}-dags

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-webserver
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestion
    component: webserver
spec:
  type: {{ .Values.global.networking.type | default "ClusterIP" }}
  selector:
    app: ingestion
    component: webserver
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    {{- if eq (.Values.global.networking.type | default "ClusterIP") "NodePort" }}
    nodePort: {{ .Values.openmetadataIngestion.webserver.nodePort }}
    {{- end }}
{{- end }}
