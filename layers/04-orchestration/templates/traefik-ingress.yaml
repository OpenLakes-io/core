{{- if .Values.global.networking.enableIngressRoutes }}
---
# ═══════════════════════════════════════════════════════════════
# Airflow - Ingress Route
# ═══════════════════════════════════════════════════════════════
# Access Airflow UI at: http://airflow.openlakes.local
{{- if .Values.airflow.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orchestration-airflow
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow
    layer: orchestration
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`airflow.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: {{ .Values.airflow.fullnameOverride }}-webserver
          port: 8080  # Airflow webserver port
{{- end }}

---
# ═══════════════════════════════════════════════════════════════
# Airflow - Secure Ingress Route (HTTPS)
# ═══════════════════════════════════════════════════════════════
# Access Airflow UI at: https://airflow.openlakes.dev
{{- if .Values.airflow.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orchestration-airflow-secure
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow
    layer: orchestration
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`airflow.{{ .Values.global.networking.domain }}`)
      kind: Rule
      services:
        - name: {{ .Values.airflow.fullnameOverride }}-webserver
          port: 8080
  tls:
    certResolver: letsencrypt
    domains:
      - main: airflow.{{ .Values.global.networking.domain }}
{{- end }}
{{- end }}
