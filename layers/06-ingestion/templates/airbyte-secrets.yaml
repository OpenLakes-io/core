{{- if .Values.airbyte.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: airbyte-config-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: config
type: Opaque
stringData:
  # MinIO credentials for Airbyte storage
  minio-access-key-id: {{ .Values.airbyte.global.storage.minio.accessKeyId | quote }}
  minio-secret-access-key: {{ .Values.airbyte.global.storage.minio.secretAccessKey | quote }}
  aws-access-key-id: {{ .Values.airbyte.global.storage.minio.accessKeyId | quote }}
  aws-secret-access-key: {{ .Values.airbyte.global.storage.minio.secretAccessKey | quote }}
{{- end }}
