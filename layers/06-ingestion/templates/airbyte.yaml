{{- if .Values.airbyte.enabled }}
# Airbyte Installation Instructions
#
# Airbyte is a complex multi-component system that requires:
# - airbyte-server, airbyte-worker, airbyte-webapp, airbyte-temporal, and more
# - Approximately 10GB of Docker images
# - Its own database, storage, and orchestration
#
# RECOMMENDED INSTALLATION:
# Use the official Airbyte Helm chart instead of this simplified template:
#
# 1. Add Airbyte Helm repository:
#    helm repo add airbyte https://airbytehq.github.io/helm-charts
#    helm repo update
#
# 2. Install Airbyte:
#    helm install airbyte airbyte/airbyte \
#      --namespace {{ .Values.global.namespace }} \
#      --set global.database.host={{ .Values.airbyte.database.host }} \
#      --set global.database.port={{ .Values.airbyte.database.port }}
#
# For more information:
# - Official Helm Chart: https://github.com/airbytehq/helm-charts
# - Documentation: https://docs.airbyte.com/deploying-airbyte/on-kubernetes
#
# This template is disabled by default because it cannot provide
# a functional Airbyte deployment with a single container.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.airbyte.fullnameOverride }}-instructions
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: instructions
data:
  README.md: |
    # Airbyte Installation Instructions

    To deploy Airbyte, use the official Helm chart:

    ```bash
    # Add Airbyte Helm repository
    helm repo add airbyte https://airbytehq.github.io/helm-charts
    helm repo update

    # Install Airbyte
    helm install airbyte airbyte/airbyte --namespace {{ .Values.global.namespace }}
    ```

    For configuration options, see:
    https://github.com/airbytehq/helm-charts
{{- end }}
