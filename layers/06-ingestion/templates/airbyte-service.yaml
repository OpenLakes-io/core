{{- if .Values.airbyte.enabled }}
---
# Airbyte Webapp Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airbyte.fullnameOverride }}-webapp
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: webapp
spec:
  type: {{ .Values.global.networking.type }}
  {{- if eq .Values.global.networking.type "NodePort" }}
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
    nodePort: {{ .Values.airbyte.service.nodePort }}
  {{- else }}
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  {{- end }}
  selector:
    app: airbyte
    component: webapp
---
# Airbyte Server Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airbyte.fullnameOverride }}-server
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: server
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: airbyte
    component: server
---
# Airbyte Worker Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airbyte.fullnameOverride }}-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: worker
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: airbyte
    component: worker
---
# Temporal Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.airbyte.fullnameOverride }}-temporal
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airbyte
    component: temporal
spec:
  type: ClusterIP
  ports:
  - port: 7233
    targetPort: 7233
    protocol: TCP
    name: grpc
  selector:
    app: airbyte
    component: temporal
{{- end }}