global:
  networking:
    type: NodePort
  storageClass: local-path
  namespace: openlakes

airbyte:
  # Airbyte Official Helm Chart (v2.x) - integrated as subchart dependency
  enabled: true
  fullnameOverride: 06-ingestion-airbyte
  # Override subchart service names to be simple
  nameOverride: airbyte

  # Service Account configuration (RBAC defined in templates/airbyte-rbac.yaml)
  serviceAccount:
    create: false
    name: airbyte-sa

  # Use existing PostgreSQL
  global:
    database:
      type: external
      host: postgres
      port: 5432
      database: airbyte
      user: openlakes
      password: openlakes123
      jdbcUrl: "jdbc:postgresql://postgres:5432/airbyte?sslmode=disable"

    storage:
      type: minio
      minio:
        enabled: false
        endpoint: http://minio:9000
        accessKeyId: admin
        secretAccessKey: admin123
      bucket:
        log: airbyte-logs
        state: airbyte-state
        workloadOutput: airbyte-output

    edition: community

  # Disable internal PostgreSQL
  postgresql:
    enabled: false

  # Resource limits for local development
  server:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  # Webapp is not available as a separate component in Airbyte 2.x
  # The UI is served by the server component
  webapp:
    enabled: false

  worker:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  temporal:
    enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    extraEnv:
      - name: POSTGRES_TLS_ENABLED
        value: "false"
      - name: SQL_TLS_ENABLED
        value: "false"
      - name: DBNAME
        value: "temporal"
      - name: VISIBILITY_DBNAME
        value: "temporal_visibility"

  # Environment
  env_vars:
    TRACKING_STRATEGY: logging

  # Bootloader configuration (disable remote connector registry for offline/local deployment)
  airbyte-bootloader:
    env_vars:
      AUTO_UPGRADE_CONNECTORS: "false"
      APPLY_DEFINITIONS_ON_START: "false"

debezium:
  enabled: true
  fullnameOverride: debezium
  image:
    repository: debezium/connect
    tag: "3.0.0.Final"
  replicas: 1
  groupId: "debezium-cluster"
  kafka:
    host: kafka
    port: 9092
  service:
    nodePort: 30810
  resources:
    limits:
      memory: 2Gi
