global:
  networking:
    type: NodePort
  storageClass: local-path
  namespace: openlakes

airbyte:
  # Airbyte core components deployment
  # Note: This is a simplified deployment. For production, consider using the official Helm chart
  # DISABLED due to resource constraints - enable when you have more memory available
  enabled: false
  fullnameOverride: airbyte
  image:
    tag: "0.50.42"  # Using stable version instead of 2.0.1
  service:
    nodePort: 30800
  database:
    host: postgres
    port: 5432
    name: airbyte
    user: openlakes
    password: openlakes123
  s3:
    endpoint: http://minio:9000
    accessKey: admin
    secretKey: admin123

  # Component resource configurations (reduced for local development)
  webapp:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi

  server:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

  worker:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

  temporal:
    resources:
      limits:
        cpu: 200m
        memory: 512Mi

debezium:
  enabled: false  # Disable for now due to resource constraints
  fullnameOverride: debezium
  image:
    repository: quay.io/debezium/connect
    tag: "3.3"
  replicas: 1
  groupId: "debezium-cluster"
  kafka:
    host: kafka
    port: 9092
  service:
    nodePort: 30810
  resources:
    limits:
      memory: 1Gi
