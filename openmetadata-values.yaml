# OpenMetadata Values
# Configure to use existing PostgreSQL and MinIO

global:
  elasticsearch:
    host: openmetadata-dependencies-elasticsearch
    port: 9200
    scheme: http
    auth:
      enabled: false
  database:
    type: postgres  # Use PostgreSQL instead of MySQL
    host: openlakes-postgres
    port: 5432
    driverClass: org.postgresql.Driver
    databaseName: openmetadata_db
    auth:
      username: openmetadata_user
      password: openmetadata_pass

openmetadata:
  config:
    database:
      type: postgres
      host: openlakes-postgres
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata_db
      auth:
        username: openmetadata_user
        password: openmetadata_pass

    elasticsearch:
      host: openmetadata-dependencies-elasticsearch
      port: 9200
      scheme: http

    pipelineServiceClientConfig:
      apiEndpoint: http://openmetadata-dependencies-web:8080
      metadataApiEndpoint: http://openmetadata:8585/api
      ingestionIpInfoEnabled: false

    authentication:
      provider: basic
      publicKeys:
        - "http://openmetadata:8585/api/v1/system/config/jwks"
      authority: "https://accounts.google.com"
      clientId: ""
      callbackUrl: ""
      enableSelfSignup: true
      jwtPrincipalClaims:
        - "email"
        - "preferred_username"
        - "sub"

    authorizer:
      className: "org.openmetadata.service.security.DefaultAuthorizer"
      containerRequestFilter: "org.openmetadata.service.security.JwtFilter"
      initialAdmins:
        - "admin"
      principalDomain: "open-metadata.org"

    airflow:
      enabled: true
      host: http://openmetadata-dependencies-web:8080
      auth:
        username: admin
        password: admin

    secretsManager:
      provider: noop

  image:
    repository: docker.getcollate.io/openmetadata/server
    tag: 1.10.6
    pullPolicy: IfNotPresent

  sidecars: []

  service:
    type: NodePort
    port: 8585
    targetPort: 8585
