# Airbyte Official Helm Chart Configuration (v2.x)
# Integrated with OpenLakes infrastructure

# Service Account with secrets access
serviceAccount:
  create: false
  name: airbyte-sa

# Use existing PostgreSQL
global:
  database:
    type: external
    host: postgres
    port: 5432
    database: airbyte
    user: openlakes
    password: openlakes123
    jdbcUrl: "jdbc:postgresql://postgres:5432/airbyte?sslmode=disable"

  storage:
    type: minio
    minio:
      enabled: false
      endpoint: http://minio:9000
      accessKeyId: admin
      secretAccessKey: admin123
    bucket:
      log: airbyte-logs
      state: airbyte-state
      workloadOutput: airbyte-output

  edition: community

# Disable internal PostgreSQL
postgresql:
  enabled: false

# Resource limits for local development
server:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

webapp:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: NodePort
    port: 80
    nodePort: 30800

worker:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

temporal:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env_vars:
    POSTGRES_TLS_ENABLED: "false"
    SQL_TLS_ENABLED: "false"
    DB_PORT: "5432"
    DBNAME: "temporal"
    VISIBILITY_DBNAME: "temporal_visibility"

# Environment
env_vars:
  TRACKING_STRATEGY: logging

# Bootloader configuration
airbyte-bootloader:
  env_vars:
    AUTO_UPGRADE_CONNECTORS: "false"
    APPLY_DEFINITIONS_ON_START: "false"
